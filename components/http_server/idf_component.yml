dependencies:
  espressif/cjson:
    version: "^1.7.19"
  app_claw:
    public: false
    rules:
      - if: $CONFIG{HTTP_SERVER_CLAW_ENABLE} == True
    path: ../../third_party/esp-mosaico-claw/components/app_claw
  cap_im_local:
    public: false
    rules:
      - if: $CONFIG{HTTP_SERVER_CLAW_ENABLE} == True && $CONFIG{APP_CLAW_CAP_IM_LOCAL} == True && $CONFIG{HTTPD_WS_SUPPORT} == True
    path: ../../third_party/esp-mosaico-claw/third-party/esp-claw/components/claw_capabilities/cap_im_local
  cap_im_platform:
    public: false
    rules:
      - if: $CONFIG{HTTP_SERVER_CLAW_ENABLE} == True && $CONFIG{APP_CLAW_CAP_IM_WECHAT} == True
    path: ../../third_party/esp-mosaico-claw/third-party/esp-claw/components/claw_capabilities/cap_im_platform
  lua_module_http_server:
    public: false
    rules:
      - if: $CONFIG{HTTP_SERVER_CLAW_ENABLE} == True && $CONFIG{APP_CLAW_CAP_LUA} == True && $CONFIG{APP_CLAW_LUA_MODULE_HTTP_SERVER} == True
    path: ../../third_party/esp-mosaico-claw/third-party/esp-claw/components/lua_modules/lua_module_http_server
