version: "1.0"
description: "matter_hub overrides for the esp_mosaico board: BLE central + client-only Matter controller + 480x480 Mosaic GSP UI"

# Auto-applied by `idf.py bmgr` whenever this directory sits on a `-c` path and
# the selected board is named `esp_mosaico` (its definition lives in the
# esp-mosaico-claw submodule; this overlay is layered on top).
apply:
  - sdkconfig.defaults.board
